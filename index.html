<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drey</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --black: #060608;
  --discord: #7289da;
  --discord-glow: rgba(114,137,218,0.22);
  --surface: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.07);
  --border-hover: rgba(114,137,218,0.45);
  --text: #f0ece8;
  --muted: rgba(240,236,232,0.4);
  --gold: #c8a97e;
}

html, body {
  min-height: 100%;
  background: var(--black);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  overflow-x: hidden;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.055'/%3E%3C/svg%3E");
  background-size: 180px;
  opacity: 0.4;
  pointer-events: none;
  z-index: 1000;
}

#canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

.orb {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  filter: blur(90px);
  transition: transform 0.8s cubic-bezier(0.16,1,0.3,1);
}
.orb-top {
  width: 500px; height: 500px;
  top: -200px; left: 50%; transform: translateX(-50%);
  background: radial-gradient(circle, rgba(114,137,218,0.08), transparent 65%);
}
.orb-bottom {
  width: 400px; height: 400px;
  bottom: -100px; left: 50%; transform: translateX(-50%);
  background: radial-gradient(circle, rgba(200,169,126,0.06), transparent 65%);
}

.page {
  position: relative;
  z-index: 1;
  max-width: 420px;
  margin: 0 auto;
  padding: 3.5rem 1.5rem 6rem;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Profile */
.profile {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 2.5rem;
  opacity: 0;
  animation: profileIn 1s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
}

@keyframes profileIn {
  from { opacity: 0; transform: translateY(30px) scale(0.95); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.avatar-wrap {
  position: relative;
  width: 120px; height: 120px;
  margin-bottom: 1.4rem;
}

.avatar-wrap::after {
  content: '';
  position: absolute;
  inset: -14px;
  border-radius: 50%;
  border: 1px solid rgba(114,137,218,0.15);
  animation: breathe 3.5s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { transform: scale(1); opacity: 0.4; }
  50%       { transform: scale(1.06); opacity: 1; }
}

.ring-outer {
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  animation: spinRing 3s linear infinite;
  background: conic-gradient(
    transparent 0deg,
    rgba(114,137,218,0) 10deg,
    rgba(114,137,218,0.9) 50deg,
    rgba(180,160,255,1) 90deg,
    rgba(200,169,126,0.8) 140deg,
    transparent 165deg
  );
}

@keyframes spinRing {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

.ring-mask {
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  background: var(--black);
  z-index: 1;
}

.avatar-img {
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  overflow: hidden;
  z-index: 2;
}

.avatar-img img {
  width: 100%; height: 100%;
  object-fit: cover;
  border-radius: 50%;
  display: block;
  transition: transform 0.6s cubic-bezier(0.16,1,0.3,1);
}

.avatar-wrap:hover .avatar-img img { transform: scale(1.06); }
.avatar-wrap:hover .ring-outer { filter: drop-shadow(0 0 10px rgba(114,137,218,0.5)); }

.profile-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.2rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--text);
  margin-bottom: 0.3rem;
  text-align: center;
}

.profile-bio {
  font-size: 0.75rem;
  font-weight: 300;
  color: var(--muted);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-align: center;
}

/* Divider */
.divider {
  width: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--discord), var(--gold), transparent);
  margin-bottom: 2.5rem;
  animation: expandLine 0.9s cubic-bezier(0.16,1,0.3,1) 0.9s forwards;
}

@keyframes expandLine { to { width: 160px; } }

/* Card */
.link-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.1rem 1.3rem;
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  text-decoration: none;
  color: var(--text);
  overflow: hidden;
  cursor: pointer;
  opacity: 0;
  transform: translateY(24px) scale(0.97);
  animation: cardIn 0.7s cubic-bezier(0.16,1,0.3,1) 1.1s forwards;
  transition:
    background 0.3s ease,
    border-color 0.3s ease,
    transform 0.25s cubic-bezier(0.16,1,0.3,1),
    box-shadow 0.3s ease;
}

@keyframes cardIn {
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.link-card .shimmer {
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
  animation: shimmer 1.4s ease 1.6s forwards;
  pointer-events: none;
}

@keyframes shimmer { to { left: 160%; } }

.link-card .bg-glow {
  position: absolute;
  inset: 0;
  border-radius: 18px;
  opacity: 0;
  background: radial-gradient(ellipse at 25% 50%, var(--discord-glow), transparent 70%);
  transition: opacity 0.35s ease;
  pointer-events: none;
}

.link-card:hover { background: rgba(114,137,218,0.07); border-color: var(--border-hover); transform: translateY(-3px) scale(1.01); box-shadow: 0 8px 32px rgba(114,137,218,0.12), 0 0 0 1px rgba(114,137,218,0.1); }
.link-card:hover .bg-glow { opacity: 1; }
.link-card:active { transform: scale(0.985); }

.link-icon {
  position: relative;
  width: 46px; height: 46px;
  border-radius: 13px;
  background: rgba(114,137,218,0.12);
  border: 1px solid rgba(114,137,218,0.2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.3s, transform 0.3s cubic-bezier(0.16,1,0.3,1);
}

.link-card:hover .link-icon { background: rgba(114,137,218,0.2); transform: rotate(-8deg) scale(1.1); }

.link-text { flex: 1; }

.link-title { font-size: 0.95rem; font-weight: 500; color: var(--text); transition: color 0.2s; }
.link-card:hover .link-title { color: #b8c8ff; }

.member-count { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 0.7rem; color: var(--muted); }
.member-avatars { display: flex; }
.member-avatars span { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--black); margin-left: -4px; }
.member-avatars span:first-child { margin-left: 0; }

.link-arrow {
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--muted);
  font-size: 0.8rem;
  transition: transform 0.3s cubic-bezier(0.16,1,0.3,1), color 0.3s, border-color 0.3s, background 0.3s;
}
.link-card:hover .link-arrow { transform: translateX(3px); color: var(--discord); border-color: rgba(114,137,218,0.5); background: rgba(114,137,218,0.1); }

.online-dot {
  position: absolute;
  top: 11px; right: 14px;
  display: flex; align-items: center; gap: 5px;
  font-size: 0.63rem;
  color: rgba(57,200,130,0.85);
  letter-spacing: 0.05em;
}
.online-dot::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #39c882; box-shadow: 0 0 6px rgba(57,200,130,0.8); animation: blink 2s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* Footer */
.footer { margin-top: 3rem; font-size: 0.68rem; color: rgba(240,236,232,0.15); letter-spacing: 0.1em; text-transform: uppercase; opacity: 0; animation: fadeIn 1s ease 1.8s forwards; }
@keyframes fadeIn { to { opacity: 1; } }

/* Ripple */
.ripple { position: absolute; border-radius: 50%; background: rgba(114,137,218,0.2); transform: scale(0); animation: rippleOut 0.7s ease-out forwards; pointer-events: none; }
@keyframes rippleOut { to { transform: scale(5); opacity: 0; } }

/* CSS particles */
.particle { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; animation: floatUp linear infinite; opacity: 0; }
@keyframes floatUp { 0%{transform:translateY(0) translateX(0);opacity:0} 10%{opacity:1} 90%{opacity:0.6} 100%{transform:translateY(-100vh) translateX(var(--drift));opacity:0} }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="orb orb-top"></div>
<div class="orb orb-bottom"></div>

<script>
(function(){
  for(let i=0;i<20;i++){
    const p=document.createElement('div');
    p.className='particle';
    const s=Math.random()*2.5+0.8;
    const c=Math.random()>0.5?'114,137,218':'200,169,126';
    p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;bottom:${-Math.random()*20}%;background:rgba(${c},${Math.random()*0.35+0.1});--drift:${(Math.random()-0.5)*80}px;animation-duration:${Math.random()*14+10}s;animation-delay:${Math.random()*14}s`;
    document.body.appendChild(p);
  }
})();
</script>

<main class="page">

  <div class="profile">
    <div class="avatar-wrap">
      <div class="ring-outer"></div>
      <div class="ring-mask"></div>
      <div class="avatar-img">
        <img src="https://d209nv3nexrgbg.cloudfront.net/media/users_app/blob_8jRtNzZ" alt="Drey" loading="eager">
      </div>
    </div>
    <h1 class="profile-name">Drey</h1>
    <p class="profile-bio">Links oficiais</p>
  </div>

  <div class="divider"></div>

  <a href="https://discord.com/invite/X83SS2b4HU"
     class="link-card"
     onclick="ripple(event)"
     target="_blank"
     rel="noopener">

    <span class="online-dot">online</span>
    <div class="shimmer"></div>
    <div class="bg-glow"></div>

    <div class="link-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#7289da">
        <path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
    </div>

    <div class="link-text">
      <div class="link-title">Discord</div>
      <div class="member-count">
        <div class="member-avatars">
          <span style="background:linear-gradient(135deg,#7289da,#5865f2)"></span>
          <span style="background:linear-gradient(135deg,#c8a97e,#e8c89e)"></span>
          <span style="background:linear-gradient(135deg,#39c882,#2aa76b)"></span>
        </div>
        Entre no servidor
      </div>
    </div>

    <div class="link-arrow">→</div>
  </a>

  <p class="footer">© 2026 Drey</p>

</main>

<script>
/* Canvas: aurora + stars */
(function(){
  const canvas=document.getElementById('canvas');
  const ctx=canvas.getContext('2d');
  let W,H;
  function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
  resize();
  window.addEventListener('resize',resize);

  const stars=Array.from({length:130},()=>({
    x:Math.random(),y:Math.random(),
    r:Math.random()*1.2+0.2,
    a:Math.random()*0.55+0.08,
    speed:Math.random()*0.00007+0.00002,
    phase:Math.random()*Math.PI*2
  }));

  const blobs=[
    {x:0.5,y:-0.1,r:0.55,c:[114,137,218],p:0,s:0.0003},
    {x:0.2,y:0.7,r:0.4,c:[200,169,126],p:1.5,s:0.0004},
    {x:0.8,y:0.5,r:0.35,c:[100,80,200],p:3.0,s:0.0005},
  ];

  let t=0;
  let mx=0.5,my=0.5;
  document.addEventListener('mousemove',e=>{mx=e.clientX/W;my=e.clientY/H;});

  function draw(){
    ctx.clearRect(0,0,W,H);
    t+=0.01;

    for(const b of blobs){
      const bx=(b.x+Math.sin(t*b.s*1000+b.p)*0.12+(mx-0.5)*0.04)*W;
      const by=(b.y+Math.cos(t*b.s*800+b.p)*0.1+(my-0.5)*0.04)*H;
      const br=b.r*Math.min(W,H);
      const g=ctx.createRadialGradient(bx,by,0,bx,by,br);
      g.addColorStop(0,`rgba(${b.c},0.055)`);
      g.addColorStop(1,'transparent');
      ctx.fillStyle=g;
      ctx.fillRect(0,0,W,H);
    }

    for(const s of stars){
      const tw=0.5+0.5*Math.sin(t*1.2+s.phase);
      ctx.beginPath();
      ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(230,220,210,${s.a*tw})`;
      ctx.fill();
      s.y-=s.speed;
      if(s.y<0){s.y=1;s.x=Math.random();}
    }

    requestAnimationFrame(draw);
  }
  draw();
})();

function ripple(e){
  const card=e.currentTarget;
  const rect=card.getBoundingClientRect();
  const r=document.createElement('span');
  r.className='ripple';
  const size=Math.max(rect.width,rect.height);
  r.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
  card.appendChild(r);
  r.addEventListener('animationend',()=>r.remove());
}

document.addEventListener('mousemove',e=>{
  const x=(e.clientX/innerWidth-0.5)*18;
  const y=(e.clientY/innerHeight-0.5)*18;
  document.querySelector('.orb-top').style.transform=`translateX(calc(-50% + ${x*0.5}px)) translateY(${y*0.5}px)`;
  document.querySelector('.orb-bottom').style.transform=`translateX(calc(-50% + ${-x*0.4}px)) translateY(${-y*0.4}px)`;
});
</script>
</body>
</html>
